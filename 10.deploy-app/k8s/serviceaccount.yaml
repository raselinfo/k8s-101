
# ─── ServiceAccount Specification ────────────────────────────────────────────
# A ServiceAccount is an identity for PODS (just like a user account is an
# identity for humans). Kubernetes gives every pod the identity of a
# ServiceAccount; the default one is used if you don't specify any.
#
# Why create a dedicated one?
#   1. imagePullSecrets: attach registry credentials ONCE here — every pod
#      using this SA can pull from the private registry, no need to repeat
#      imagePullSecrets in each deployment
#   2. RBAC: grant this identity specific API permissions (Role bindings)
#   3. Least privilege: this app's pods get their own identity, separate
#      from other apps in the namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: express-sa
  labels:
    app: express
# Attach the docker-registry pull secret here.
# Created once (create command below) and shared by every pod using this SA.
imagePullSecrets:
  - name: regcred
