# ─── Deployment Specification ────────────────────────────────────────────────
# A Deployment is a higher-level controller that manages ReplicaSets,
# which in turn create and manage Pods for you.
# So you do NOT need a separate pod.yaml — this file alone creates the pods.
apiVersion: apps/v1 # API group + version for workloads (Deployments live in "apps")
kind: Deployment # Resource type
metadata:
  name: express-deploy # Name of the Deployment itself
  labels:
    app: express # Labels for the Deployment object (used by tools/queries)
spec:
  replicas: 3 # Desired number of identical pods (ReplicaSet keeps this count)
  selector:
    matchLabels:
      app: express # How the Deployment FINDS the pods it owns (must match template labels)
  template:
    # ─── Pod Specification (template) ──────────────────────────────────────
    # Blueprint for each pod the ReplicaSet creates. Note: no "name" needed —
    # k8s auto-generates names like express-deploy-59f5d6458-dbvcr.
    metadata:
      labels:
        app: express # Pods get this label; MUST match selector.matchLabels above
    spec:
      # Pod identity. Pods run as this ServiceAccount.
      # Used for imagePullSecrets (private registries) and RBAC permissions.
      serviceAccountName: express-sa
      containers:
        - name: express # Container name inside the pod
          # image: k8s-101-deploy-app:latest # Image loaded into the kind cluster
          image: raselstacklearner/privet-k8s-image:latest # Image loaded into the kind cluster
          # imagePullPolicy: IfNotPresent # Use local image; don't pull from Docker Hub
          imagePullPolicy: Always # Use remote image; always pull from Docker Hub
          ports:
            - containerPort: 4010 # Port the app listens on (informational + docs)
          # ─── Resource Requests (required for HPA) ───────────────────────
          # HPA computes CPU usage as a PERCENTAGE OF REQUESTS.
          # No requests → HPA cannot do CPU-based autoscaling.
          # requests = guaranteed minimum (scheduler uses this)
          # limits  = maximum allowed (throttled beyond this)
          resources:
            requests:
              cpu: 100m # 0.1 of a core
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ─── Environment Variables ──────────────────────────────────────
          # envFrom = inject ALL keys from ConfigMap/Secret as env vars.
          # Scales to any number of keys without touching this file —
          # just add KEY=VALUE to the ConfigMap/Secret and rollout restart.
          envFrom:
            - configMapRef:
                name: express-config # Non-sensitive config (NODE_ENV, LOG_LEVEL, APP_NAME...)
            - secretRef:
                name: express-env # Sensitive values, created from .env file
          # Per-key alternative (self-documenting + fails fast on missing key):
          # env:
          #   - name: LOG_LEVEL
          #     valueFrom:
          #       configMapKeyRef:
          #         name: express-config
          #         key: LOG_LEVEL
